# mtg-engine configuration. Override the path with MTG_ENGINE_CONFIG=/path/to/file.yaml

database_url: sqlite:///data/mtg_engine.db

http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  timeout_seconds: 30
  proxy: null              # global proxy for all requests; env MTG_ENGINE_PROXY overrides
                           # per-marketplace proxies: marketplaces.<name>.proxy or env MTG_ENGINE_PROXY_<NAME>

region:
  country: ES
  map_center: [40.2, -3.7]
  map_zoom: 6
  # Wallapop searches are radius-based: sweep these points to cover the country.
  search_radius_km: 200
  search_points:
    - {name: Madrid, lat: 40.4168, lon: -3.7038}
    - {name: Barcelona, lat: 41.3874, lon: 2.1686}
    - {name: Valencia, lat: 39.4699, lon: -0.3763}
    - {name: Sevilla, lat: 37.3891, lon: -5.9845}
    - {name: Málaga, lat: 36.7213, lon: -4.4214}
    - {name: Bilbao, lat: 43.2630, lon: -2.9350}
    - {name: A Coruña, lat: 43.3623, lon: -8.4115}
    - {name: Zaragoza, lat: 41.6488, lon: -0.8891}
    - {name: Valladolid, lat: 41.6523, lon: -4.7245}
    - {name: Badajoz, lat: 38.8794, lon: -6.9707}
    - {name: Murcia, lat: 37.9922, lon: -1.1307}
    - {name: Palma, lat: 39.5696, lon: 2.6502}
    - {name: Las Palmas, lat: 28.1235, lon: -15.4363}
    - {name: Santa Cruz de Tenerife, lat: 28.4636, lon: -16.2518}

marketplaces:
  wallapop:
    enabled: true
    max_pages: 5
    delay_seconds: 2.0
    use_search_points: true
    proxy: null             # needs a Spanish/EU exit IP: set MTG_ENGINE_PROXY_WALLAPOP=http://user:pass@host:port
  milanuncios:
    enabled: true
    max_pages: 3
    delay_seconds: 4.0
    # httpx | playwright | apify. Plain requests are blocked by Milanuncios' anti-bot service;
    # apify runs the zen-studio/milanuncios-scraper actor (token: env/secret APIFY_TOKEN; billed by Apify)
    fetcher: apify
    apify_actor: zen-studio/milanuncios-scraper
    max_results: 100        # per query
    max_results_per_run: 500  # total per scan run, to bound the Apify bill
    use_search_points: false

games:
  mtg:
    enabled: true
    queries:
      - magic the gathering alpha
      - magic the gathering beta
      - mtg alpha
      - mtg beta
      - magic edicion limitada
      - magic limited edition
      - cartas magic 1993
      - cartas magic antiguas
      - black lotus
      - power nine magic
    # Generic Spanish searches: every ad with photos goes through card recognition, so
    # Alpha/Beta cards in lots and collections are found even when the text doesn't name them.
    photo_queries:
      - cartas magic
      - lote cartas magic
      - coleccion cartas magic
      - cartas magic the gathering
      - lote magic the gathering
      - cartas mtg
    targets:
      - set_code: lea
        label: Alpha
        # UPPERCASE keywords match case-sensitively ("lea" is also a Spanish verb).
        keywords: [alpha, alfa, LEA, "limited edition alpha", "edicion limitada alpha"]
      - set_code: leb
        label: Beta
        keywords: [beta, LEB, "limited edition beta", "edicion limitada beta"]
    # Sets synced for vision training/negatives but never reported as targets.
    confuser_sets: [2ed, 3ed, ced, cei]
    filters:
      min_card_value_eur: 3          # ignore matched cards cheaper than this
      min_listing_value_eur: 25      # a listing must be worth at least this to open a deal
      max_listing_price_eur: null    # skip ads asking more than this
      rarities: []                   # e.g. [rare, uncommon]; empty = all
      type_contains: []              # e.g. [Creature, Artifact]; empty = all
      exclude_basic_lands: false
    red_flags: [proxy, proxys, replica, "réplica", fake, falsa, falso, playtest, "gold border",
                "borde dorado", "coleccionista",
                unlimited, revised, "edicion revisada", "4th edition", "cuarta edicion",
                # other printings named explicitly (seen on real ads) - Alpha/Beta were English-only
                "quinta edicion", "5th edition", "sexta edicion", "6th edition", "septima edicion",
                "7th edition", "octava edicion", "8th edition", "novena edicion", "9th edition",
                "decima edicion", "10th edition", reprint, reimpresion, unhinged, unglued, tempest,
                tempestad, "5a edicion",
                "4a edicion", "borde blanco", "white border"]
    # Rule an ad out entirely: Alpha/Beta were printed in English only, so cards in other
    # languages (e.g. the black-bordered Korean/Japanese/French reprints) are never Alpha/Beta.
    exclude_flags: [coreano, coreana, coreanos, coreanas, korean, chino, chinos, chinas, chinese,
                    japones, japonesa, japoneses, japonesas, japanese, frances, francesa, franceses,
                    francesas, french, aleman, alemana, alemanes, alemanas, german, italiano, italiana,
                    italianos, italianas, italian, portugues, portuguesa, portugueses, portuguesas,
                    portuguese, ruso, rusa, rusos, rusas, russian,
                    "en español", "en castellano", "version española", "edicion española",
                    foil, foils,  # Alpha/Beta were never printed in foil
                    # black-bordered reprints sold as such: never Alpha/Beta
                    "collector's edition", "collectors edition", "collector edition", "edicion coleccionista",
                    "international edition", "edicion internacional"]

  pokemon:
    enabled: false
    queries: [pokemon base set primera edicion, pokemon 1st edition charizard]
    targets:
      - {set_code: base1, label: Base Set, keywords: [base set, "set base", "edicion basica"]}
    confuser_sets: []
    filters: {min_card_value_eur: 5, min_listing_value_eur: 30}
    red_flags: [proxy, replica, fake, falsa, custom]

pricing:
  currency: EUR
  usd_to_eur: 0.92
  sources: [cardmarket_price_guide, scryfall]

vision:
  enabled: true            # uses models/card_model.onnx + gallery.npz (trained on RunPod, committed); falls back to text-only if missing
  model_path: models/card_model.onnx
  gallery_path: models/gallery.npz
  min_similarity: 0.55
  max_images_per_listing: 6
  # matches seen only in photos (no supporting text) must clear a higher bar
  photo_min_similarity: 0.7
  photo_min_edition_prob: 0.7

deals:
  auto_open_min_value_eur: 25
  auto_open_min_ratio: 1.2         # value / asking price

scheduler:
  interval_minutes: 60

map:
  # osm_dark: OpenStreetMap tiles darkened in CSS | osm | carto_dark | none
  # (tile.openstreetmap.org is for light use with attribution; host your own for heavy traffic)
  tiles: osm_dark
  boundaries: es-provinces.geojson   # bundled province shapes (IGN via es-atlas); drawn even if tiles fail
