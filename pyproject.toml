[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-engine"
version = "0.1.0"
description = "Scan second-hand marketplaces for valuable trading cards, rank deals, feed downstream agents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "selectolax>=1.0",
  "typer>=0.12",
  "numpy>=1.26",
  "pillow>=10",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
vision = ["onnxruntime>=1.17", "opencv-python-headless>=4.9"]
browser = ["playwright>=1.44"]
postgres = ["psycopg[binary]>=3.1"]
train = [
  "torch>=2.2", "torchvision>=0.17", "timm>=1.0",
  "pytorch-metric-learning>=2.5", "albumentations>=1.4",
  "onnx>=1.16", "pandas>=2", "tqdm", "huggingface_hub>=0.23",
]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
mtg-engine = "mtg_engine.cli:app"

[tool.setuptools.packages.find]
include = ["mtg_engine*"]

[tool.setuptools.package-data]
mtg_engine = ["web/*", "geo/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
