name: scan
# Scans the marketplaces (text queries + photo queries with card recognition), refreshes the
# static dashboard in site/ and commits it; Vercel redeploys on every push to main.
# The SQLite database (listings, deals, photo-recognition cache) lives on the `engine-data`
# branch as a single gzip'd commit, so runs build on each other without growing history.
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "all = text + photo queries, photo = photo queries only, text = text queries only"
        type: choice
        options: [all, photo, text]
        default: all
      marketplace:
        description: "Only this marketplace (empty = all), e.g. milanuncios"
        default: ""
      milanuncios_max_results:
        description: "One-off: Milanuncios results per search, lifting the per-run budget (e.g. 10000 = everything)"
        default: ""
      import_file:
        description: "Also analyse ads from this JSON file in the repo (e.g. imports/....json), photos included"
        default: ""
      recheck:
        description: "Also re-check every stored ad's photos with the current model (slow; off = incremental)"
        type: boolean
        default: false
      max_queries:
        description: "Only run the first N queries of each kind (empty = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-hosted maximum is 360; the steps below are bounded to fit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[vision]'

      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth 1 origin engine-data 2>/dev/null; then
            git show FETCH_HEAD:mtg_engine.db.gz | gunzip > data/mtg_engine.db
            ls -l data/mtg_engine.db
          else
            echo "no engine-data branch yet: starting with an empty database"
          fi

      - run: mtg-engine sync-catalog
      - name: Note the start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Scan
        # reads every search result (19,000+ ads); photos of new ads are read in the next step.
        # The scan stops itself at its time limit, so nothing is killed mid-write.
        timeout-minutes: 140
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}   # Milanuncios via Apify; skipped if unset
          MODE: ${{ inputs.mode || 'all' }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          MARKETPLACE: ${{ inputs.marketplace }}
          MTG_ENGINE_MAX_RESULTS_MILANUNCIOS: ${{ inputs.milanuncios_max_results }}
        run: |
          args=()
          case "$MODE" in
            photo) args+=(--photo) ;;
            text) args+=(--no-photo) ;;
          esac
          if [ -n "$MAX_QUERIES" ]; then args+=(--max-queries "$MAX_QUERIES"); fi
          if [ -n "$MARKETPLACE" ]; then args+=(--marketplace "$MARKETPLACE"); fi
          mtg-engine scan --defer-photos --max-minutes 120 "${args[@]}" 2> >(tee scan.log >&2) | tee scan-stats.json
          [ -s scan-stats.json ] || echo '{"note": "scan stopped early"}' > scan-stats.json
      - name: Import scraped ads
        if: ${{ inputs.import_file != '' }}
        env:
          IMPORT_FILE: ${{ inputs.import_file }}
        run: mtg-engine import-ads "$IMPORT_FILE" 2>> scan.log | tee -a import-stats.json
      - name: Scan summary (as annotations, readable through the API)
        if: always()
        run: |
          [ -f scan.log ] || exit 0
          grep -E "milanuncios|apify|query |stopped|ERROR|Traceback|Error" scan.log | grep -v "HTTP Request" | tail -25 \
            | sed -e 's/%/%25/g' -e 's/^/::notice title=scan::/'
          echo "::notice title=stats::$(cat scan-stats.json)"
          [ -f import-stats.json ] && echo "::notice title=import::$(tr '\n' ' ' < import-stats.json)" || true
      - name: Read photos never read and apply the current rules to all stored ads
        if: ${{ !inputs.recheck }}
        # gets the rest of the run (job limit 350 min, ~20 kept for saving and publishing);
        # a backlog of unread photos is worked off over several runs, priority ads first
        run: |
          left=$(( 325 - ($(date +%s) - JOB_START) / 60 ))
          mtg-engine rematch --keep-photos --max-minutes $(( left > 10 ? left : 10 )) 2> >(tee rematch.log >&2)
        timeout-minutes: 330
        continue-on-error: true
      - name: Re-check all ads with the current rules (also verifies photos of text matches)
        if: ${{ inputs.recheck }}
        # a new model/detector re-reads every photo: bounded, continues on the next run
        run: |
          left=$(( 325 - ($(date +%s) - JOB_START) / 60 ))
          mtg-engine rematch --max-minutes $(( left > 10 ? left : 10 )) 2> >(tee rematch.log >&2)
        timeout-minutes: 330
        continue-on-error: true
      - name: Photo summary (as annotations)
        if: always()
        run: |
          [ -f rematch.log ] || exit 0
          grep -E "rematch|ERROR|Traceback|Error" rematch.log | grep -v "HTTP Request" | tail -8 \
            | sed -e 's/%/%25/g' -e 's/^/::notice title=photos::/'
      - run: mtg-engine enrich-sellers 2> >(tee -a after.log >&2)
        continue-on-error: true   # never keep the dashboard from being published
      - run: mtg-engine agents run 2> >(tee -a after.log >&2)
        continue-on-error: true
      - name: Errors after the scan (as annotations)
        if: always()
        run: |
          [ -f after.log ] || exit 0
          grep -E "Error|Traceback|locked" after.log | tail -8 | sed -e 's/%/%25/g' -e 's/^/::notice title=after::/'
      - run: mtg-engine export-static

      - name: Save database
        if: always()
        run: |
          [ -f data/mtg_engine.db ] || exit 0
          tmp=$(mktemp -d)
          gzip -c data/mtg_engine.db > "$tmp/mtg_engine.db.gz"
          cd "$tmp"
          git init -q -b engine-data
          git config user.name "mtg-engine bot"
          git config user.email "mtg-engine-bot@users.noreply.github.com"
          git add mtg_engine.db.gz
          git commit -q -m "Database snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" engine-data

      - name: Publish dashboard
        run: |
          git config user.name "mtg-engine bot"
          git config user.email "mtg-engine-bot@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then echo "dashboard unchanged"; exit 0; fi
          git commit -q -m "Dashboard snapshot $(date -u +%FT%TZ): $(cat scan-stats.json)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
