name: text-check
# Measures the photo text check before it changes the dashboard (CLAUDE.md: check real results first):
#   1. accuracy on real card scans (Beta / Unlimited / Revised / 4th / foreign) from Scryfall;
#   2. replay on every ad now on the dashboard: what would be hidden and why.
# Reports are pushed to the `engine-reports` branch; the database and dashboard are not changed.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Card names to sample for the scan accuracy test"
        default: "40"
      ocr:
        description: "OCR engines to measure, comma-separated: tesseract, paddle"
        default: "tesseract"
      replay:
        description: "Also replay on the dashboard ads"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -q tesseract-ocr
      - run: pip install -e '.[vision]'
      - if: contains(inputs.ocr, 'paddle')
        run: pip install paddlepaddle==3.0.0 paddleocr==3.0.0
      - name: Restore database
        run: |
          mkdir -p data
          git fetch --depth 1 origin engine-data
          git show FETCH_HEAD:mtg_engine.db.gz | gunzip > data/mtg_engine.db
      - name: Replay on the dashboard ads
        if: inputs.replay
        continue-on-error: true
        run: mtg-engine text-check-replay --out replay.json | tee replay-summary.json
      - name: Accuracy on card scans
        continue-on-error: true
        timeout-minutes: 90
        run: |
          for e in $(echo "${{ inputs.ocr }}" | tr ',' ' '); do
            out=scans.json; [ "$e" = tesseract ] || out="scans-$e.json"
            python ml/eval_textcheck.py --names "${{ inputs.names }}" --ocr "$e" --out "$out" | tail -20
          done
      - name: Push reports
        if: always()
        run: |
          tmp=$(mktemp -d)
          # keep the reports this run didn't redo
          git fetch -q --depth 1 origin engine-reports && git --work-tree="$tmp" checkout FETCH_HEAD -- . || true
          cp replay.json scans*.json scans*.rows.jsonl "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b engine-reports
          git config user.name "mtg-engine bot"
          git config user.email "mtg-engine-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Text check reports $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" engine-reports
          echo "::notice title=replay::$(cat $GITHUB_WORKSPACE/replay-summary.json 2>/dev/null)"
